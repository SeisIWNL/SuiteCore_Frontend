server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA history mode ──────────────────────────────────
    # Cualquier ruta desconocida devuelve index.html para que
    # Vue Router (createWebHistory) maneje el enrutamiento.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Caché agresiva para assets con hash ───────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── index.html nunca se cachea ────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Compresión gzip ───────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ── (OPCIONAL) Proxy hacia tu backend .NET ────────────
    # Si prefieres que Nginx reenvíe /api al backend en lugar
    # de exponerlo con una URL pública, descomenta este bloque
    # y en el build usa VITE_API_BASE_URL=/api
    #
    # location /api/ {
    #     proxy_pass https://TU_BACKEND:7073/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_ssl_verify off;  # backend .NET con certificado self-signed
    # }

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
